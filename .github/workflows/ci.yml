name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Exercise action.yml as a real composite action, both outcomes.
  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate fixture trees
        run: node scripts/make-action-fixture.mjs "$RUNNER_TEMP/screenproof-fixture"
      - name: Action passes on a valid tree
        uses: ./
        with:
          path: ${{ runner.temp }}/screenproof-fixture/good
          strict: "true"
      - name: Action fails on an invalid tree
        id: bad
        continue-on-error: true
        uses: ./
        with:
          path: ${{ runner.temp }}/screenproof-fixture/bad
      - name: Assert the invalid tree failed the action
        env:
          BAD_OUTCOME: ${{ steps.bad.outcome }}
        run: |
          if [ "$BAD_OUTCOME" != "failure" ]; then
            echo "expected the bad fixture to fail the action, got: $BAD_OUTCOME"
            exit 1
          fi
